[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-rf-stack"
version = "0.1.0"
description = "Reproducible MRI RF field benchmarks and inverse-imaging experiments"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]
plot = ["matplotlib>=3.7"]

[project.scripts]
mri-rf = "mri_rf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]
