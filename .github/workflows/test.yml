name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
  hertzon-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libegl1 libxrender1 libxkbcommon0
      - run: python -m pip install '.[test]' -r requirements-solver.txt
      - run: python -m pytest -q
      - run: mri-rf model outputs/smoke --passes 1
      - run: mri-rf solve outputs/smoke/birdcage.hzn outputs/smoke/solver
      - run: mri-rf analyze outputs/smoke/solver outputs/smoke/materials.json outputs/smoke/analysis
      - run: mri-rf jemris outputs/smoke/analysis/fields.npz outputs/smoke/analysis/coil.h5 --reference-b1-ut 1
      - name: Check physical output bounds (smoke, not convergence)
        run: |
          python - <<'PY'
          import json
          report = json.load(open('outputs/smoke/analysis/report.json'))
          assert report['tissue_mass_kg'] > 0
          assert 0 < report['tissue_absorbed_fraction'] <= 1.05
          assert report['bplus_mean_uT'] > 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hertzon-smoke
          path: |
            outputs/smoke/analysis/
            outputs/smoke/solver/*.json
            outputs/smoke/solver/solver.log
          retention-days: 14
